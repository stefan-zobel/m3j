% The configuration of m3build, the build system of m3j (m3j.cfg).
%
% m3build reads this file, as cm3 reads cm3.cfg, before the m3makefile of a
% package. It finds it in the directory of the package (., src or ../src),
% in the file or directory that the environment variable M3J_CONFIG names,
% or in the directory of m3j (M3J_HOME, where m3j.jar is).
%
% The target of m3j is the JVM: the build directory of a package is JVM.
% TARGET and BUILD_DIR are "JVM"; OS_TYPE is the system that m3build runs
% on (POSIX or WIN32), whose conventions a program follows when it runs.
%
% The installation (-ship) is the directory that the option -root DIR or
% the environment variable M3J_ROOT names: packages are installed in
% ROOT/pkg, programs in ROOT/bin. Without one, packages are built but
% not installed.
%
% Packages are found in the installation, then in those that m3j brings
% (M3J_LIB: the directory lib of m3j: m3core, libm3, tcp, netobj and
% sysutils), then in an installation of cm3 that the option -cm3 DIR or
% the environment variable CM3_ROOT names (CM3_PKG: its directory pkg).

if not defined("CR") CR = "\n" end
if not defined("EOL") EOL = "\n" end
if not defined("M3_PROFILING") M3_PROFILING = FALSE end
if not defined("SL") SL = "/" end

% m3build defines M3J_HOME and M3J_JAVA; for other readers of this file:
% the directory of this file and the java on the PATH
if not defined("M3J_HOME") M3J_HOME = path() end
if not defined("M3J_JAVA") M3J_JAVA = "java" end

readonly TARGET = "JVM"
readonly TARGET_OS = "JVM"
readonly TARGET_ARCH = "JVM"
readonly TARGET_ENDIAN = "LITTLE"
readonly WORD_SIZE = "64BITS"
readonly BUILD_DIR = "JVM"
readonly NAMING_CONVENTIONS = "0"
readonly M3_BACKEND_MODE = "JVM"

%------------------------------------------------------------- installation ---

if not defined("M3J_ROOT")
    M3J_ROOT = $M3J_ROOT
end

if equal(M3J_ROOT, "")
    % no installation: a place that has no packages
    INSTALL_ROOT = M3J_HOME & SL & "no-installation"
    readonly M3J_SHIP = FALSE
else
    INSTALL_ROOT = M3J_ROOT
    readonly M3J_SHIP = TRUE
end

readonly BIN_INSTALL    = INSTALL_ROOT & SL & "bin"     % executables
readonly LIB_INSTALL    = INSTALL_ROOT & SL & "lib"     % libraries
readonly PKG_INSTALL    = INSTALL_ROOT & SL & "pkg"     % packages
readonly DOC_INSTALL    = INSTALL_ROOT & SL & "doc"     % documents
readonly EMACS_INSTALL  = INSTALL_ROOT & SL & "elisp"   % emacs lisp code
readonly MAN_INSTALL    = INSTALL_ROOT & SL & "man"     % man pages
readonly HTML_INSTALL   = INSTALL_ROOT & SL & "www"     % public hypertext

USE_ROOT  = INSTALL_ROOT
BIN_USE   = BIN_INSTALL     % executables
LIB_USE   = LIB_INSTALL     % libraries
PKG_USE   = PKG_INSTALL     % packages

% m3j compiles programs from the sources of the libraries that they use:
% a library installs all of its sources
readonly INSTALL_IMPLS = TRUE

%---------------------------------------------------------------- packages ---

readonly M3J_LIB = M3J_HOME & SL & "lib"

if not defined("CM3_ROOT")
    CM3_ROOT = $CM3_ROOT
end
if equal(CM3_ROOT, "")
    readonly CM3_PKG = ""
else
    readonly CM3_PKG = CM3_ROOT & SL & "pkg"
end

%------------------------------------------------------------------ programs ---

% the programs of cm3 that templates run, built by m3j
if not defined("M3BUNDLE")
    M3BUNDLE = "\"" & M3J_JAVA & "\" -jar \"" & M3J_HOME & SL & "m3bundle.jar\""
end
if not defined("STUBGEN")
    STUBGEN = "\"" & M3J_JAVA & "\" -Xss64m -jar \"" & M3J_HOME & SL & "stubgen.jar\""
end

%--------------------------------------------------------------------- misc ---

readonly HAVE_PKGTOOLS = FALSE
readonly AT_SRC = FALSE
readonly SYSTEM_LIBORDER = []
readonly SYSTEM_LIBS = {}

proc set_config_options() is
    m3_option("-why")   %-- explain what's happening and why
end

if not defined("q_exec")
readonly proc q_exec(a) is
    return try_exec(a)
end
end

% m3j has no graphical user interface
proc HasTrestle() is return FALSE end
proc HasGui() is return FALSE end
proc HasOpenGL() is return FALSE end

% no system libraries on the JVM
proc configure_system_libs() is end
