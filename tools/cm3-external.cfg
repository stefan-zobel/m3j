% Local configuration for producing M3CG binary files (.mc, .ic) with the
% reference cm3: like the installed cm3.cfg, but with the external back-end
% mode, in which the front end writes the binary intermediate code directly.
if not defined("SL") SL = "/" end
if not defined("HOST") HOST = "AMD64_NT" end
if not defined("TARGET") TARGET = HOST end
% The installed cm3: the environment variable CM3_INSTALL if it is set,
% else the directory cm3 next to the directory of this file (the reference
% cm3 in the root of m3j, when M3CONFIG names this file in tools).
INSTALL_ROOT = $CM3_INSTALL
if equal(INSTALL_ROOT, "")
  INSTALL_ROOT = path() & SL & ".." & SL & "cm3"
end
include(INSTALL_ROOT & SL & "bin" & SL & "config" & SL & TARGET)
M3_BACKEND_MODE = "3"
